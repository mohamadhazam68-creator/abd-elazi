<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abd Elaziz Mohamed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  color: #fff;

  background:
    radial-gradient(circle at top, #263238 0, #111 42%, #050505 100%);

  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 430px;
  text-align: center;

  padding: 30px 22px 26px;

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 28px;

  background: rgba(18,18,18,.82);

  backdrop-filter: blur(12px);

  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.profile {
  width: 145px;
  height: 145px;

  border-radius: 50%;
  object-fit: cover;

  border: 4px solid rgba(255,255,255,.9);

  box-shadow: 0 10px 30px rgba(0,0,0,.4);

  margin-bottom: 18px;
}

h1 {
  font-size: 27px;
  margin: 4px 0 8px;

  font-weight: 700;
  letter-spacing: .2px;
}

.subtitle {
  font-size: 14px;
  color: #bdbdbd;

  margin-bottom: 25px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

a {
  text-decoration: none;
  color: #fff;

  display: block;

  padding: 15px 18px;

  border-radius: 15px;

  background: rgba(255,255,255,.08);

  border: 1px solid rgba(255,255,255,.1);

  font-size: 16px;
  font-weight: 600;

  transition: .2s;
}

a:hover {
  background: rgba(255,255,255,.15);
  transform: translateY(-1px);
}

.footer {
  margin-top: 24px;

  color: #777;

  font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

  <img
    class="profile"
    src="photo.jpg"
    alt="Abd Elaziz Moahmed"
  >

  <h1>Abd Elaziz Mohamed</h1>

  <div class="subtitle">
    كل يوم بداية جديدة
  </div>

  <div class="buttons">

    <a href="tel:+201142460200">
      📞 اتصال
    </a>

    <a
      href="https://wa.me/201112009261"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 WhatsApp
    </a>

    <a
      href="https://www.facebook.com/share/1EUyTWb5xM/"
      target="_blank"
      rel="noopener noreferrer"
    >
      📘 Facebook
    </a>

  </div>

  <div class="footer">
    Zizo Market
  </div>

</div>

</body>
</html>
