<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abd Elaziz Mohamed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  color: #fff;

  background:
    radial-gradient(circle at 80% 10%, rgba(108, 75, 160, .13), transparent 28%),
    radial-gradient(circle at 15% 85%, rgba(210, 165, 70, .08), transparent 28%),
    linear-gradient(145deg, #020304 0%, #0a0d11 48%, #030405 100%);

  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 14px;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;

  background:
    linear-gradient(120deg, transparent 0 48%, rgba(255,255,255,.025) 49%, transparent 50%),
    linear-gradient(300deg, transparent 0 58%, rgba(255,255,255,.018) 59%, transparent 60%);

  background-size: 260px 260px;
}

body::after {
  content: "";
  position: fixed;
  width: 380px;
  height: 380px;
  right: -190px;
  bottom: -190px;
  border-radius: 50%;
  background: rgba(205, 160, 70, .07);
  filter: blur(90px);
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 2;
  text-align: center;
}

.profile {
  width: 125px;
  height: 125px;
  object-fit: cover;
  object-position: center top;
  border-radius: 50%;

  border: 3px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 0 5px rgba(255,255,255,.035),
    0 15px 45px rgba(0,0,0,.75);

  margin-bottom: 16px;
}

h1 {
  margin: 0;
  font-size: 31px;
  font-weight: 700;
  letter-spacing: .4px;
}

.name-line {
  width: 55px;
  height: 2px;
  margin: 11px auto 9px;
  background: #c9a65b;
  border-radius: 10px;
}

.subtitle {
  color: #9299a2;
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 27px;
}

.button {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 76px;

  padding: 12px 16px;
  margin: 12px 0;

  text-decoration: none;
  color: #fff;

  border-radius: 19px;

  background: rgba(17, 22, 28, .9);
  border: 1px solid rgba(255,255,255,.09);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.025);

  transition: .25s ease;
}

.button:hover {
  transform: translateY(-2px);
  border-color: rgba(201,166,91,.35);
}

.button:active {
  transform: scale(.98);
}

.icon {
  width: 48px;
  height: 48px;
  min-width: 48px;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;
  font-weight: bold;

  background: rgba(255,255,255,.06);
  margin-left: 14px;
}

.button-text {
  flex: 1;
  text-align: right;
}

.button-title {
  display: block;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
}

.button-subtitle {
  display: block;
  color: #858d97;
  font-size: 12px;
}

.arrow {
  font-size: 22px;
  color: #747c86;
  margin-right: 7px;
}

.whatsapp .icon {
  background: rgba(37,211,102,.12);
}

.facebook .icon {
  background: rgba(24,119,242,.12);
}

.phone-button .icon {
  background: rgba(201,166,91,.10);
}

.phone {
  direction: ltr;
  margin-top: 24px;
  color: #777f89;
  font-size: 13px;
  letter-spacing: 1px;
}

.footer {
  margin-top: 28px;
  color: #505862;
  font-size: 10px;
  letter-spacing: 2px;
}

.footer-line {
  width: 80px;
  height: 1px;
  margin: 0 auto 12px;
  background: rgba(255,255,255,.15);
}

@media (max-width: 430px) {

  body {
    padding: 18px 13px;
  }

  .profile {
    width: 118px;
    height: 118px;
  }

  h1 {
    font-size: 28px;
  }

  .button {
    min-height: 72px;
  }
}
</style>
</head>

<body>

<div class="card">

  <img src="photo.jpg" class="profile" alt="Abd Elaziz Mohamed">

  <h1>Abd Elaziz Mohamed</h1>

  <div class="name-line"></div>

  <div class="subtitle">
    كل يوم بداية جديدة
  </div>

  <!-- اتصال -->
  <a
    class="button phone-button"
    href="tel:+201142460200"
  >
    <div class="icon">☎</div>

    <div class="button-text">
      <span class="button-title">اتصال</span>
      <span class="button-subtitle">01142460200</span>
    </div>

    <div class="arrow">←</div>
  </a>

  <!-- WhatsApp -->
  <a
    class="button whatsapp"
    href="https://wa.me/201112009261"
    target="_blank"
    rel="noopener"
  >
    <div class="icon">◉</div>

    <div class="button-text">
      <span class="button-title">WhatsApp</span>
      <span class="button-subtitle">تواصل معي</span>
    </div>

    <div class="arrow">←</div>
  </a>

  <!-- Facebook -->
  <a
    class="button facebook"
    href="https://www.facebook.com/share/1EUyTWb5xM/"
    target="_blank"
    rel="noopener"
  >
    <div class="icon">f</div>

    <div class="button-text">
      <span class="button-title">Facebook</span>
      <span class="button-subtitle">Abd Elaziz Mohamed</span>
    </div>

    <div class="arrow">←</div>
  </a>

  <div class="phone">
    01142460200
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    ZIZO MARKET © 2026
  </div>

</div>

</body>
</html>
