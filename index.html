<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abd Elaziz Mohamed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Tahoma, sans-serif;
  color: #fff;

  background:
    radial-gradient(circle at 20% 10%, rgba(80,60,120,.18), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(90,60,20,.12), transparent 35%),
    linear-gradient(145deg, #08090d, #101118 45%, #050505);

  padding: 30px 18px 40px;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  text-align: center;
}

/* الصورة */

.profile-wrap {
  width: 225px;
  height: 225px;
  margin: 0 auto 25px;
  padding: 7px;

  border-radius: 50%;

  background: #11131a;

  border: 7px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 0 8px rgba(255,255,255,.04),
    0 10px 40px rgba(0,0,0,.55);
}

.profile {
  width: 100%;
  height: 100%;

  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* الاسم */

h1 {
  margin: 0;

  font-size: 42px;
  font-weight: 700;

  letter-spacing: .2px;
}

/* الخط الذهبي */

.gold-line {
  width: 105px;
  height: 4px;

  background: #c9a45b;

  border-radius: 10px;

  margin: 22px auto 18px;
}

/* الشعار */

.subtitle {
  color: #aaa;
  font-size: 20px;

  margin-bottom: 48px;
}

/* الكروت */

.buttons {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.contact-btn {
  width: 100%;
  min-height: 108px;

  display: flex;
  align-items: center;

  text-decoration: none;
  color: #fff;

  background: rgba(17,21,27,.92);

  border: 2px solid rgba(255,255,255,.08);

  border-radius: 28px;

  padding: 15px 18px;

  transition: .25s ease;

  direction: ltr;
}

.contact-btn:hover {
  transform: translateY(-3px);

  background: rgba(25,29,36,.98);

  border-color: rgba(255,255,255,.15);
}

/* الأيقونات */

.icon {
  width: 70px;
  height: 70px;

  min-width: 70px;

  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 32px;
  font-weight: bold;
}

.info {
  flex: 1;

  text-align: right;

  padding-right: 20px;
}

.title {
  font-size: 27px;
  font-weight: 700;

  margin-bottom: 6px;
}

.text {
  font-size: 17px;
  color: #999;
}

.arrow {
  font-size: 30px;
  color: #888;

  padding-left: 8px;
}

/* ألوان الأيقونات */

.phone .icon {
  background: #292b25;
}

.whatsapp .icon {
  background: #0d3529;
}

.facebook .icon {
  background: #102942;
}

/* الفوتر */

.footer {
  margin-top: 45px;

  color: #777;

  font-size: 15px;
}

/* الموبايل */

@media (max-width: 500px) {

  body {
    padding: 25px 16px 35px;
  }

  .profile-wrap {
    width: 210px;
    height: 210px;
  }

  h1 {
    font-size: 36px;
  }

  .subtitle {
    font-size: 18px;
    margin-bottom: 40px;
  }

  .contact-btn {
    min-height: 100px;
    border-radius: 25px;
  }

  .icon {
    width: 64px;
    height: 64px;
    min-width: 64px;
    font-size: 29px;
  }

  .title {
    font-size: 23px;
  }

  .text {
    font-size: 15px;
  }

  .arrow {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- الصورة -->
  <div class="profile-wrap">
    <img
      class="profile"
      src="photo.jpg"
      alt="Abd Elaziz Mohamed"
    >
  </div>

  <!-- الاسم -->
  <h1>Abd Elaziz Mohamed</h1>

  <!-- الخط الذهبي -->
  <div class="gold-line"></div>

  <!-- الشعار -->
  <div class="subtitle">
    كل يوم بداية جديدة
  </div>

  <!-- أزرار التواصل -->
  <div class="buttons">

    <!-- الاتصال -->
    <a
      class="contact-btn phone"
      href="tel:+201142460200"
    >
      <div class="arrow">←</div>

      <div class="info">
        <div class="title">اتصال</div>
        <div class="text">01142460200</div>
      </div>

      <div class="icon">☎</div>
    </a>

    <!-- WhatsApp -->
    <a
      class="contact-btn whatsapp"
      href="https://wa.me/201112009261"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="arrow">←</div>

      <div class="info">
        <div class="title">WhatsApp</div>
        <div class="text">تواصل معي</div>
      </div>

      <div class="icon">◉</div>
    </a>

    <!-- Facebook -->
    <a
      class="contact-btn facebook"
      href="https://www.facebook.com/share/1EUyTWb5xM/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="arrow">←</div>

      <div class="info">
        <div class="title">Facebook</div>
        <div class="text">Abd Elaziz Mohamed</div>
      </div>

      <div class="icon">f</div>
    </a>

  </div>

  <!-- اسم البراند -->
  <div class="footer">
    Zizo Market
  </div>

</div>

</body>
</html>
